name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded runs on a PR branch are wasted minutes — only the newest push matters.
  # Not on main: a cancelled run there leaves no eval artifact for that commit, and the
  # published baselines are the thing this repo is arguing with.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.10 is the floor in pyproject; 3.13 is what development happens on. The pair
        # catches both "used a feature too new for the floor" and "broke on the newest".
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,agent]"
      - run: python -m pytest tests/ -q

  eval-gate:
    # The regression gate. The eval suite runs on every PR and fails if a published
    # metric drops, so a change that quietly makes review quality worse cannot merge
    # while the numbers in BASELINE.md still claim otherwise.
    #
    # Deterministic arms only: no OPENAI_API_KEY, so nothing here costs money or
    # depends on model sampling. The agent comparison is run by hand (evals/compare.py).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"

      - name: Severity eval
        run: python -m evals.runner

      - name: Retrieval eval
        run: python -m evals.retrieval_eval

      - name: Check-layer eval
        run: python -m evals.checks_eval

      # Validation only: no key here, so the agent never runs. It keeps the SQL
      # checklist fixtures resolvable and their labels citing real rules, so a live run
      # (by hand, like evals/compare.py) never scores a broken fixture as a model error.
      - name: SQL checklist fixtures are valid
        run: python -m evals.sql_policy_eval --dry-run

      - name: Assert published baselines have not regressed
        run: python .github/scripts/check_baselines.py

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            evals/results.json
            evals/retrieval_results.json
            evals/checks_results.json
