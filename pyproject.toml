[project]
name = "dbt-sentinel"
version = "0.2.0"
description = "Blast-radius review for dbt pull requests"
requires-python = ">=3.10"
license = { file = "LICENSE" }
# pyyaml is the only runtime dependency: the day-4 policy pack is YAML, and retrieval
# is part of the core deterministic path rather than an LLM add-on. Retrieval itself is
# stdlib-only (TF-IDF over the rule pack) specifically to avoid an embeddings dependency
# and to keep eval numbers reproducible offline.
dependencies = ["pyyaml"]

[project.optional-dependencies]
# Day 5: the reviewer agent. pydantic only at the LLM boundary, per CLAUDE.md.
# `openai` replaces `anthropic` after the agent was ported at the user's request.
# CLAUDE.md's allowed list names `anthropic` and not `openai`, so this is a recorded
# deviation from the project's own dependency constraint, not an oversight.
agent = ["openai", "pydantic"]
# Day 8: webhook receiver for the GitHub App. `cryptography` is the one thing the
# App JWT cannot be hand-rolled without — RSA signing. Everything else in github.py
# uses urllib and stdlib base64 rather than adding requests or PyJWT.
server = ["fastapi", "uvicorn", "cryptography"]
# `dev` carries the agent deps because the test suite imports them: test_day5 and
# test_day6 exercise the Pydantic Finding schema and the agent's degradation paths with
# an injected fake client. A bare `pip install -e ".[dev]"` that cannot collect the
# suite makes the README's own test command fail, which is how this was found.
dev = ["pytest", "openai", "pydantic"]

[project.scripts]
dbt-sentinel = "dbt_sentinel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbt_sentinel"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
